<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Career Quest · Halyk</title>
  <link rel="stylesheet" href="/styles.css?v=358bafb">
</head>
<body>
  <div id="login" class="login-screen">
    <div class="login-card">
      <div class="halyk-mark">✦</div>
      <div class="brand-title">Halyk <span>Career</span></div>
      <p>Личный кабинет развития сотрудника</p>
      <label class="field-label" for="employee-code">Код сотрудника</label>
      <input id="employee-code" class="code-input" value="E0002" autocomplete="off" placeholder="Например, E0002">
      <button id="login-button" class="primary-button">Войти</button>
      <div class="demo-hint">Демо-вход: E0001, E0002 или E0028</div>
    </div>
  </div>
  <div id="app" hidden>
    <header class="mobile-header"><div class="brand-title">Halyk <span>Career</span></div><div class="header-actions"><button id="notification-button" class="notification-button" aria-label="Уведомления"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><span id="notification-badge">2</span></button><div id="notification-panel" class="notification-panel" hidden></div><div class="secure-label">Личный кабинет</div></div></header>
    <main class="mobile-shell"><div id="error" class="error" hidden></div><div id="loading" class="loading">Загружаем профиль…</div><section id="employee-home" hidden></section><section id="hr-overview" hidden></section></main>
    <nav id="bottom-nav" class="bottom-nav"><button class="nav-item active" data-view="home"><span class="nav-icon home-icon"></span>Главная</button><button class="nav-item" data-view="development"><span class="nav-icon growth-icon"></span>Развитие</button><button class="nav-item" data-view="coins"><span class="nav-icon coin-icon"></span>Coins</button><button class="nav-item" data-view="profile"><span class="nav-icon profile-icon"></span>Профиль</button></nav>
  </div>
  <script src="/app.js?v=358bafb"></script>
</body>
</html>
